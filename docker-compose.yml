services:
  db:
    image: postgres:17-alpine
    container_name: slot-exam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: university_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d university_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
